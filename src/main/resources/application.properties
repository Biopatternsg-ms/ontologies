#Mongo
quarkus.mongodb.connection-string=${DB_URL:mongodb://localhost:27017}
quarkus.mongodb.credentials.username=${DB_USER}
quarkus.mongodb.credentials.password=${DB_PASSWORD}
quarkus.mongodb.database=${DB_NAME}
quarkus.mongodb.credentials.auth-source=admin

#Logs
quarkus.log.category."org.mongodb.driver".level=WARN

#External services
ebi-api/mp-rest/url=https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms
ncbi-api/mp-rest/url=https://eutils.ncbi.nlm.nih.gov/entrez/eutils

#Internal services
biological-objects-api/mp-rest/url=http://search-biological-objects:8080

# RabbitMQ conection
rabbitmq-host=${RABBIT_HOST:localhost}
rabbitmq-port=${RABBIT_PORT:5672}
rabbitmq-username=${RABBIT_USER}
rabbitmq-password=${RABBIT_PASSWORD}

# Producer channel configuration
mp.messaging.outgoing.ncbi-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.ncbi-out.exchange.name=exchange-ncbi
mp.messaging.outgoing.ncbi-out.host=${rabbitmq-host:localhost}
mp.messaging.outgoing.ncbi-out.port=${rabbitmq-port:5672}
mp.messaging.outgoing.ncbi-out.username=${rabbitmq-username}
mp.messaging.outgoing.ncbi-out.password=${rabbitmq-password}
mp.messaging.outgoing.ncbi-out.routing.key=mesh-queue

# Consumer channel configuration
mp.messaging.incoming.ncbi-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ncbi-in.queue.name=mesh-queue
mp.messaging.incoming.ncbi-in.host=${rabbitmq-host}
mp.messaging.incoming.ncbi-in.port=${rabbitmq-port}
mp.messaging.incoming.ncbi-in.username=${rabbitmq-username}
mp.messaging.incoming.ncbi-in.password=${rabbitmq-password}
mp.messaging.incoming.ncbi-in.exchange.name=exchange-ncbi
